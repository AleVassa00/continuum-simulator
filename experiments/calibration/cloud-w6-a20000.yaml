# Third calibration point. Select the highest calibration factor for which
# Simulator, Edge and Kafka remain healthy and W1 is the component under pressure.
# Copy the selected value into every worker-scaling YAML.
experiment:
  name: calibration-w6-a20000

workload:
  acceleration_factor: 20000
  start_lead_time: 30s

simulator:
  telemetry_queue_capacity: 5000
  start_late_tolerance: 10s

edge:
  window_size: 5m
  ingress_queue_capacity: 10000
  kafka_producer_batch_size: 10
  kafka_producer_batch_max_wait: 100ms

cloud:
  consumer_commit_batch_size: 100
  max_edge_watermark_skew: 720h
  workers: 6
  window_size: 15m

global:
  max_partition_watermark_skew: 720h

kafka:
  partitions: 6
