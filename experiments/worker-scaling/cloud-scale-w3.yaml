# PROVISIONAL acceleration_factor: replace it with the value selected by
# experiments/calibration before the official campaign.
experiment:
  name: cloud-scale-w3

workload:
  acceleration_factor: 20000
  start_lead_time: 30s

simulator:
  telemetry_queue_capacity: 5000
  start_late_tolerance: 10s

edge:
  window_size: 5m
  ingress_queue_capacity: 15000
  kafka_producer_batch_size: 10
  kafka_producer_batch_max_wait: 100ms

cloud:
  consumer_commit_batch_size: 100
  max_edge_watermark_skew: 720h
  workers: 3
  window_size: 15m

global:
  max_partition_watermark_skew: 720h

kafka:
  partitions: 6
