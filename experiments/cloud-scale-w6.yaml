experiment:
  name: cloud-scale-w6

workload:
  acceleration_factor: 10000
  start_lead_time: 30s

simulator:
  telemetry_queue_capacity: 5000
  start_late_tolerance: 10s

edge:
  window_size: 5m
  ingress_queue_capacity: 5000

cloud:
  consumer_commit_batch_size: 100
  workers: 6
  window_size: 15m

# Source topic partitions, independent of Edge count and cloud.workers.
kafka:
  partitions: 6
