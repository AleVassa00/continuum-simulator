# The rate applies independently to every Simulator container, not to their aggregate traffic.
experiment:
  name: simulator-edge-rate-2mbit

workload:
  acceleration_factor: 20000
  start_lead_time: 60s

simulator:
  telemetry_queue_capacity: 5000
  start_late_tolerance: 10s

edge:
  window_size: 5m
  ingress_queue_capacity: 10000
  kafka_producer_batch_size: 10
  kafka_producer_batch_max_wait: 100ms

cloud:
  consumer_commit_batch_size: 100
  max_edge_watermark_skew: 720h
  workers: 3
  window_size: 15m

kafka:
  partitions: 6

network:
  enabled: true
  simulator_to_edge:
    enabled: true
    delay: 0s
    rate: 2mbit
  edge_to_kafka:
    enabled: false
