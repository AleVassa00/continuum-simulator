experiment:
  name: network-baseline

workload:
  acceleration_factor: 20000
  start_lead_time: 30s

simulator:
  telemetry_queue_capacity: 100000
  start_late_tolerance: 10s

edge:
  window_size: 5m
  ingress_queue_capacity: 15000
  kafka_producer_batch_size: 10
  kafka_producer_batch_max_wait: 100ms

cloud:
  consumer_commit_batch_size: 100
  max_edge_watermark_skew_real_time: 129600ms # 720h event-time a 20000x
  workers: 6
  window_size: 15m

global:
  max_partition_watermark_skew_real_time: 129600ms # 720h event-time a 20000x

kafka:
  partitions: 6
