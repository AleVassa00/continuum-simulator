experiment:
  name: baseline

workload:
  acceleration_factor: 20000
  start_lead_time: 30s

simulator:
  telemetry_queue_capacity: 1000
  start_late_tolerance: 10s

edge:
  window_size: 5m
  ingress_queue_capacity: 1000

cloud:
  consumer_commit_batch_size: 1
  workers: 1
  window_size: 15m

# Source topic partitions, independent of Edge count and cloud.workers.
kafka:
  partitions: 6
