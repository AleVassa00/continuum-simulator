services:

  kafka:
    image: apache/kafka:4.3.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped

    networks:
      - continuum-backbone


  kafka-init:
    image: apache/kafka:4.3.0
    container_name: kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    command:
      - /bin/bash
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic edge-aggregates \
          --partitions ${KAFKA_PARTITIONS:-6} \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic cloud-edge-aggregates \
          --partitions 1 \
          --replication-factor 1

    networks:
      - continuum-backbone

  cloud-worker-0:
    image: continuum-cloud-worker:local
    container_name: cloud-worker-0

    environment:
      KAFKA_BROKER: "kafka:29092"
      KAFKA_INPUT_TOPIC: "edge-aggregates"
      KAFKA_OUTPUT_TOPIC: "cloud-edge-aggregates"
      KAFKA_GROUP_ID: "cloud-workers"
      CLOUD_WINDOW_SIZE: "15m0s"
      WORKER_ID: "cloud-worker-0"

    depends_on:
      kafka-init:
        condition: service_completed_successfully

    restart: unless-stopped

