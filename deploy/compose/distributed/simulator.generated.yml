services:

  # edge-0: 11 sensors
  simulator-edge-0:
    image: continuum-simulator:local
    container_name: simulator-edge-0
    profiles: ["replay"]
    environment:
      SITE_ID: "edge-0"
      MQTT_ENDPOINT: "tcp://${EDGE_HOST}:18830"
      REPLAY_FILE: "/app/dataset/derived/replay_by_edge/edge-0.csv"
      MAX_EVENTS: "0"
      REPLAY_EPOCH: "2025-01-01T00:00:00Z"
      REPLAY_START_AT: "${REPLAY_START_AT:?REPLAY_START_AT is required}"
      ACCELERATION_FACTOR: "10000"
      TELEMETRY_QUEUE_CAPACITY: "1000"
      START_LATE_TOLERANCE: "10s"
    volumes:
      - ../../../dataset:/app/dataset:ro
    restart: "no"

