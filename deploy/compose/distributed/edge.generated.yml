services:

  # edge-0: 11 sensors
  mqtt-edge-0:
    image: eclipse-mosquitto:2
    container_name: mqtt-edge-0
    ports:
      - "18830:1883"
    volumes:
      - ../../mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-p", "1883", "-t", "healthcheck", "-m", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - zone-edge-0

  edge-0:
    image: continuum-edge:local
    container_name: edge-0
    environment:
      EDGE_ID: "edge-0"
      MQTT_BROKER: "tcp://mqtt-edge-0:1883"
      WINDOW_SIZE: "5m0s"
      EDGE_INGRESS_QUEUE_CAPACITY: "1000"
      KAFKA_BROKER: "${CLOUD_KAFKA_HOST}:9092"
      KAFKA_TOPIC: "edge-aggregates"
    depends_on:
      mqtt-edge-0:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/readyz >/dev/null 2>&1"]
      interval: 2s
      timeout: 1s
      retries: 15
    restart: unless-stopped
    networks:
      - zone-edge-0

