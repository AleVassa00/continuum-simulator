AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Continuum project infrastructure: one Amazon Linux 2023 EC2 instance prepared
  for an automated Docker Compose deployment. MQTT is reachable only through an
  SSH tunnel.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC in which to launch the learning instance.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet with a route to an Internet Gateway.
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair used for SSH access.
  SSHLocation:
    Type: String
    Description: Your public IPv4 address in CIDR form, for example 203.0.113.10/32.
    AllowedPattern: "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$"
    ConstraintDescription: Must be an IPv4 CIDR such as 203.0.113.10/32.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
      - t2.micro
    Description: Choose a type marked Free tier eligible for your account when possible.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: AWS-managed parameter for the latest x86_64 Amazon Linux 2023 AMI.

Resources:
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH access to the Continuum learning instance
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: SSH from the student's public IP only
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation
      SecurityGroupEgress:
        - Description: Allow package and container downloads
          IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: continuum-learning-ssh
        - Key: Project
          Value: Continuum

  LearningInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeleteOnTermination: true
          DeviceIndex: "0"
          GroupSet:
            - !Ref InstanceSecurityGroup
          SubnetId: !Ref SubnetId
      Tags:
        - Key: Name
          Value: continuum-learning
        - Key: Project
          Value: Continuum
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail

          dnf install -y docker
          systemctl enable --now docker
          usermod -aG docker ec2-user

          install -d -m 0755 /usr/local/lib/docker/cli-plugins
          curl --fail --location --show-error --silent \
            https://github.com/docker/compose/releases/download/v5.4.0/docker-compose-linux-x86_64 \
            --output /usr/local/lib/docker/cli-plugins/docker-compose
          echo "837fd1d35bf6a494f41b5b5988269a7be79de337cf1a1a6ff0e45ab51bb4e9be  /usr/local/lib/docker/cli-plugins/docker-compose" \
            | sha256sum --check
          chmod 0755 /usr/local/lib/docker/cli-plugins/docker-compose
          docker compose version

          install -d -o ec2-user -g ec2-user -m 0755 /opt/continuum

Outputs:
  InstanceId:
    Description: EC2 instance identifier.
    Value: !Ref LearningInstance
  PublicDnsName:
    Description: Host name used by SSH and the deployment script.
    Value: !GetAtt LearningInstance.PublicDnsName
  PublicIp:
    Description: Current public IPv4 address. It can change after stop/start.
    Value: !GetAtt LearningInstance.PublicIp
  SSHCommand:
    Description: Replace the key placeholder with the local PEM path.
    Value: !Sub "ssh -i <key.pem> ec2-user@${LearningInstance.PublicDnsName}"
  MqttTunnelCommand:
    Description: Keep this command running while the local Simulator publishes.
    Value: !Sub >-
      ssh -i <key.pem> -N -L 1883:127.0.0.1:1883
      ec2-user@${LearningInstance.PublicDnsName}
