version: 1

# Profili applicati in seguito con tc-netem al collegamento Edge -> Cloud.
# La perdita resta a zero nella prima campagna: si isolano latenza e banda,
# che sono le variabili richieste dalla traccia.
profiles:
  baseline:
    delay: 1ms
    jitter: 0ms
    loss: 0%
    rate: 1gbit
  wan:
    delay: 50ms
    jitter: 5ms
    loss: 0%
    rate: 50mbit
  high_latency:
    delay: 150ms
    jitter: 20ms
    loss: 0%
    rate: 20mbit
  constrained:
    delay: 250ms
    jitter: 50ms
    loss: 0%
    rate: 1mbit
